<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>My Kasir</title>
  <meta name="robots" content="noindex">
  <script>
    /* Deep-link fallback untuk GitHub Pages (SPA).
     * Lihat: https://github.com/rafgraph/spa-github-pages */
    (function (l) {
      var segmentKeep = 1;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }(window.location));
  </script>
</head>
<body></body>
</html>
